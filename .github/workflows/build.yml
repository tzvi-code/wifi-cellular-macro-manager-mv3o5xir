name: Build
on: [push]
permissions:
  contents: write
  issues: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build
        id: build
        continue-on-error: true
        run: gradle assembleDebug --no-daemon --console=plain > build.log 2>&1
      - name: Report failure
        if: steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { grep -E -A3 "error:|AAPT|wrong" build.log | head -n 120 || true; echo "-----"; tail -n 30 build.log; } > report.txt
          gh issue create --title "build-failed ${GITHUB_SHA}" --body-file report.txt
          exit 1
      - name: Release
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ github.run_number }}" app/build/outputs/apk/debug/app-debug.apk --title "APK v${{ github.run_number }}" --notes "Debug APK"
